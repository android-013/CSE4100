<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product</title>
<link rel="stylesheet" href="style.css">
</head>


<body>

    <div class="card">
    
        <div class="product-img">
                
            <h4>25%</h4>
        
            <button class="favorite">
                <img class="heart" src="img/heart-angle.svg" alt="heart">
            </button>

            <img class="p-img" src="img/product1.webp" alt="product">

        </div>

        <div class="product-content">


            <h2 class="p-name"> Premium Wireless Headphones </h2>

            <p class="p-info"> High-quality noise-cancelling headphones withsuperior sound</p>

            <div class="p-star">
                <img class="star" src="img/star.svg" alt="★">
                <img class="star" src="img/star.svg" alt="★">
                <img class="star" src="img/star.svg" alt="★">
                <img class="star" src="img/star.svg" alt="★">
                <img class="star" src="img/star.svg" alt="★">
            </div>
            
            <p class="review"> 4.5 (128) </p>
        </div>

        <div class="price">

            <p class="current">$299.99</p>

            <p class="old">$399.99</p>

        </div>

        <button class="cart">
            🛒 Add to Cart
        </button>

    </div>


</div>



</body>
</html>
